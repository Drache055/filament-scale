name: Web flasher firmware

# Baut die Firmware ohne eigene secrets.h und legt sie für den Web-Flasher unter docs/firmware/ ab.
# Läuft bei jedem veröffentlichten Release und lässt sich von Hand starten.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install platformio

      - name: Build (Standard-Vorlage, Geräte-Passwort wird beim ersten Start erzeugt)
        working-directory: firmware
        run: |
          cp include/secrets.h.example include/secrets.h
          pio run -e waage

      - name: Dateien für den Web-Flasher ablegen
        env:
          VERSION: ${{ github.event.release.tag_name || github.sha }}
        run: |
          mkdir -p docs/firmware
          cp firmware/.pio/build/waage/firmware.factory.bin docs/firmware/firmware.factory.bin
          python3 - <<'PY'
          import json, os
          version = os.environ["VERSION"][:12]
          manifest = {
              "name": "Filament Scale",
              "version": version,
              "new_install_prompt_erase": True,
              "builds": [
                  {"chipFamily": "ESP32-S3", "parts": [{"path": "firmware.factory.bin", "offset": 0}]}
              ],
          }
          with open("docs/firmware/manifest.json", "w") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          PY

      - name: An das Release anhängen
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" docs/firmware/firmware.factory.bin --clobber

      - name: Commit nach main
        run: |
          git config user.name "Drache055"
          git config user.email "98689959+Drache055@users.noreply.github.com"
          git add docs/firmware
          if git diff --cached --quiet; then
            echo "Keine Änderung an der Firmware"
          else
            git commit -m "Web-Flasher: Firmware ${{ github.event.release.tag_name || github.sha }}" \
              -m "Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>"
            git push origin HEAD:main
          fi

      - name: Pages neu bauen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
