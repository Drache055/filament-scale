name: CI

on:
  push:
  pull_request:

jobs:
  native-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install platformio
      - name: Unit-Tests (Rechner)
        working-directory: firmware
        run: pio test -e native

  firmware-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install platformio
      - name: secrets.h aus Vorlage
        working-directory: firmware
        run: cp include/secrets.h.example include/secrets.h
      - name: Firmware bauen
        working-directory: firmware
        run: pio run -e waage
