name: Flasher sync

# Legt eine bereits veröffentlichte Version nachträglich im Web-Flasher ab
# (z. B. eine Pre-Release, die vor der Kanalwahl erschien). Das Image kommt aus dem Release-Asset.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release-Tag, z. B. v0.1"
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Factory-Image der Release laden
        run: |
          mkdir -p out
          gh release download "$TAG" --pattern "filament-scale-${TAG}-factory.bin" --dir out
          pre=$(gh release view "$TAG" --json isPrerelease -q .isPrerelease)
          echo "FLAG=$([ "$pre" = "true" ] && echo --prerelease)" >> "$GITHUB_ENV"

      - name: Web-Flasher aktualisieren
        run: |
          python3 tools/update_flasher.py "$TAG" "out/filament-scale-${TAG}-factory.bin" $FLAG
          git config user.name "Drache055"
          git config user.email "98689959+Drache055@users.noreply.github.com"
          git add docs/firmware
          if git diff --cached --quiet; then
            echo "Keine Änderung"
          else
            git commit -m "Web-Flasher: Firmware $TAG"
            git push origin main
          fi

      - name: Pages neu bauen
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
