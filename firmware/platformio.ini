; Basis laut CLAUDE.md, Abschnitt 3. HX711/PN532 kommen mit den jeweiligen Modulen dazu.

[env:waage]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
extra_scripts = pre:tools/version.py
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -Iinclude
monitor_speed = 115200
lib_deps =
    lvgl/lvgl@9.5.0
    lovyan03/LovyanGFX@1.3.0
    bogde/HX711@0.7.5
    adafruit/Adafruit PN532@1.3.4
    adafruit/Adafruit BusIO@1.17.4
    bblanchon/ArduinoJson@7.4.3

; Update per WLAN (ArduinoOTA). Erstes Flashen immer per USB mit env:waage.
[env:waage-ota]
extends = env:waage
upload_protocol = espota
upload_port = filamentwaage.local
upload_flags =
    --auth=${sysenv.OTA_PASSWORD}

; Unit-Tests auf dem Rechner (kein Board nötig): pio test -e native
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags = -std=gnu++17 -Isrc -Iinclude
lib_deps = bblanchon/ArduinoJson@7.4.3
build_src_filter =
    -<*>
    +<nfc/ndef.cpp>
    +<nfc/tags.cpp>
    +<nfc/cbor.cpp>
    +<nfc/openprinttag.cpp>
    +<core/queue_core.cpp>
    +<core/weigh_core.cpp>
    +<core/simple_core.cpp>
    +<core/update_core.cpp>
    +<core/diag_core.cpp>
    +<core/sensor_core.cpp>
    +<core/spool_url.cpp>
